<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invest in Qatar | Sayal</title>
    <meta name="description" content="Start investing in the Qatar stock market easily. Built for everyone, from beginners to experts in Doha.">
    
    <!-- Analytics (Your request: G-SFCYG6K8Q2) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SFCYG6K8Q2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-SFCYG6K8Q2');
    </script>

    <!-- Favicon (Your request: S-arrow fallback) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M81.5 25 L 62 78 L 19 64 L 49 82 C 69 82 75 62 62 53 C 43 40 55 25 81.5 25 Z' fill='%232c6e49' transform='rotate(45, 50, 50)'/%3E%3C/svg%3E">

    <style>
        /* Base & Variables */
        :root {
            --bg-color: #fcfbf5; /* Cream background */
            --text-color: #1a1a1a;
            --accent-color: #2c6e49; /* The green from your logo */
            --secondary-bg: #f0efe6;
            --card-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #f0efe6;
            --secondary-bg: #1f1f1f;
            --card-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 90%;
            padding: 20px 0;
        }

        /* Logo */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.2rem;
        }
        .logo svg {
            width: 40px;
            height: 40px;
            fill: var(--accent-color);
        }

        /* 01. Phone Mockup (iPhone 14 Pro Style) */
        .phone-mockup {
            position: relative;
            width: 375px;
            height: 750px;
            background: #1a1a1a;
            border-radius: 50px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); /* 1B. Removed blocky shadow */
            border: 10px solid #2d2d2d;
            margin: 40px auto;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Dynamic Island */
        .phone-mockup::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 30px;
            background: #000;
            border-radius: 20px;
            z-index: 10;
        }
        /* 09. Try the app demo label */
        .demo-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 20;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            pointer-events: none; /* Let clicks pass through to iframe */
        }
        .app-demo-frame {
            width: 100%;
            height: 100%;
            border: 0;
            background: white;
        }

        /* 04. Ribbon section (01 02 03) */
        .ribbon {
            display: flex;
            justify-content: space-around;
            padding: 40px 0;
            background: var(--secondary-bg);
            border-radius: 20px;
            margin: 40px 0;
        }
        .ribbon-item {
            text-align: center;
        }
        .ribbon-item h3 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-color);
        }
        .ribbon-item p {
            margin: 5px 0 0;
            font-size: 1rem; /* Ensures all paragraph sizes are equal */
            color: var(--text-color);
            opacity: 0.8;
        }

        /* Hero & Copy */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
        }
        h1 {
            font-size: 3rem;
            line-height: 1.2;
            margin-bottom: 10px;
        }
        .tagline {
            font-size: 1.1rem;
            max-width: 600px;
            opacity: 0.8;
        }

        /* Buttons & Forms */
        .form-container {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
        }
        input, button {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        button {
            background: var(--accent-color);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header & Logo (14. Transparent SVG) -->
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <div class="logo">
                <!-- Here is your Logo SVG. It has a transparent background and automatically adapts to dark/light mode -->
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M85 15 L55 85 C25 85 15 45 45 45 C55 45 60 30 85 15 Z" transform="rotate(20, 50, 50)" />
                </svg>
                Sayal
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="toggleTheme()" style="width: auto; padding: 8px 15px; background: transparent; border: 1px solid var(--text-color); color: var(--text-color);">Dark/Light</button>
            </div>
        </header>

        <!-- Hero & Main Demo (7 & 13. Copy targeting Qatar) -->
        <section class="hero">
            <h1>Start investing in Qatar the easy way.</h1>
            <p class="tagline">Built for everyone. From beginners to experts in Doha, learn how to grow your wealth right here.</p>
            
            <!-- 10. App Demo localhost embedded -->
            <div class="phone-mockup">
                <div class="demo-overlay">Try the app demo</div>
                <iframe src="http://localhost:56629/" class="app-demo-frame" id="app-demo"></iframe>
            </div>

            <!-- 6. Changed "Buy fractional shares" to "Invest" -->
            <p style="font-weight: bold;">Invest in seconds, not days.</p>
        </section>

        <!-- 4. Equal sized Ribbon -->
        <div class="ribbon">
            <div class="ribbon-item">
                <h3>01</h3>
                <p>Connect your account</p>
            </div>
            <div class="ribbon-item">
                <h3>02</h3>
                <p>Select your investments</p>
            </div>
            <div class="ribbon-item">
                <h3>03</h3>
                <p>Watch your wealth grow</p>
            </div>
        </div>

        <!-- 12. Formspree Endpoint -->
        <div class="form-container">
            <p style="text-align: center; margin-bottom: 20px;">Ready to start?</p>
            <form action="https://formspree.io/f/xwleypvo" method="POST">
                <input type="email" name="email" placeholder="Enter your email" required>
                <input type="text" name="name" placeholder="Full Name" required>
                <button type="submit">Get Started</button>
            </form>
        </div>
    </div>

    <script>
        // Theme toggle function
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
        }
    </script>
</body>
</html>
